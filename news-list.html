<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semua Berita - STREETART.ID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .news-search-wrap {
            background: #1a1a1a;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #333;
            margin-bottom: 26px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .news-search-wrap i { color: var(--primary); }
        .news-search-wrap input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 1rem;
        }
        .news-empty {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="top-nav">
        <button onclick="location.href='index.html'" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard
        </button>
        <div style="margin-left:auto; display:flex; align-items:center; gap:10px;">
            <img src="https://raw.githubusercontent.com/sekolakonangindonesia-prog/smipro-streetart/main/Logo_Stretart.png" style="height:35px;">
            <span style="font-weight:bold;">Semua Berita</span>
        </div>
    </nav>

    <div class="container">

        <div class="section-title"><i class="fa-regular fa-newspaper"></i> Semua Berita</div>

        <div class="news-search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="news-search-input" placeholder="Cari judul berita...">
        </div>

        <div id="all-news-container" class="news-grid">
            <div style="text-align:center; padding:50px; color:#888; grid-column: 1 / -1;">
                <i class="fa-solid fa-spinner fa-spin"></i> Memuat berita...
            </div>
        </div>

    </div>

    <!-- SCRIPT LOAD DATA -->
    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const container = document.getElementById('all-news-container');
        const searchInput = document.getElementById('news-search-input');
        const defaultImg = "https://placehold.co/400x300?text=Berita";
        let allNewsDocs = [];

        function renderNews(docs) {
            if (docs.length === 0) {
                container.innerHTML = '<div class="news-empty" style="grid-column: 1 / -1;">Belum ada berita yang cocok.</div>';
                return;
            }
            container.innerHTML = '';
            docs.forEach(docSnap => {
                const data = docSnap.data();
                const clickAction = data.type === 'external'
                    ? `window.open('${data.url}', '_blank')`
                    : `location.href='news-read.html?id=${docSnap.id}'`;
                container.innerHTML += `
                <div class="news-card-grid" onclick="${clickAction}">
                    <img src="${data.thumb || defaultImg}" class="news-grid-thumb" onerror="this.src='${defaultImg}'">
                    <div class="news-grid-body">
                        <span class="news-grid-tag">${data.tag || 'BERITA'}</span>
                        <h4 class="news-grid-title">${data.title}</h4>
                        <p class="news-grid-date">${data.date || ''}</p>
                    </div>
                </div>`;
            });
        }

        async function loadAllNews() {
            try {
                const q = query(collection(db, "news"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                allNewsDocs = querySnapshot.docs;

                if (allNewsDocs.length === 0) {
                    container.innerHTML = '<div class="news-empty" style="grid-column: 1 / -1;">Belum ada berita yang dipublikasikan.</div>';
                    return;
                }
                renderNews(allNewsDocs);
            } catch (e) {
                container.innerHTML = `<div class="news-empty" style="grid-column: 1 / -1;">Gagal memuat berita: ${e.message}</div>`;
            }
        }

        searchInput.addEventListener('input', () => {
            const keyword = searchInput.value.trim().toLowerCase();
            const filtered = allNewsDocs.filter(docSnap => {
                const data = docSnap.data();
                return (data.title || '').toLowerCase().includes(keyword)
                    || (data.tag || '').toLowerCase().includes(keyword);
            });
            renderNews(filtered);
        });

        loadAllNews();
    </script>
</body>
</html>
